<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Quotation</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><h1>PROFORMA INVOICE</h1><div class="dealer">MAHALAXMI AUTOMOTIVES PVT. LTD.</div></header><section class="card"><div class="grid"><label>NAME<input id="name" placeholder="Customer name"></label><label>DATE<input id="date" type="date"></label><label>ADDRESS<input id="address" placeholder="Address"></label><label>MOBILE<input id="mobile" inputmode="tel" placeholder="Mobile number"></label></div><label>MODEL &amp; VARIANT<select id="model"><option value="">Select model</option></select></label><div class="grid"><label>PRICE TYPE<select id="priceType"><option>INDIVIDUAL</option><option>CSD AMOUNT</option></select></label><label>PASSING<select id="passing"><option>MH PASSING</option><option>BH PASSING</option></select></label></div></section><section id="quotation" class="quote"><div class="quote-title">PARTICULARS <span>PRICE</span></div><div id="lines"></div><div class="line total"><b>TOTAL</b><b id="total">₹0</b></div><label>ACCESSORIES<input id="accessories" type="number" value="0"></label><div class="line"><b>DISCOUNT</b><input id="discount" class="money" type="number" value="0"></div><div class="line grand"><b>TOTAL</b><b id="grand">₹0</b></div></section><section class="actions"><button id="generate">GENERATE QUOTATION IMAGE</button><button id="share" disabled>SHARE IMAGE</button></section><p id="status"></p></main><script src="app.js"></script></body></html>
