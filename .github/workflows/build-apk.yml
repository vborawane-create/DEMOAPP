name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sync quotation files
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp style.css android/app/src/main/assets/style.css
          cp app.js android/app/src/main/assets/app.js
          cp prices.json android/app/src/main/assets/prices.json
          cp header.png android/app/src/main/assets/header.png
          cp stamp.png android/app/src/main/assets/stamp.png

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DemoAPP-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
